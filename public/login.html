<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — ReelsAI Studio</title>
<style>
:root{--bg:#07070b;--panel:#11111a;--line:#30303b;--text:#f8f8fb;--muted:#a4a4b2;--danger:#ff7180;--ok:#6fe39a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,#29164a 0,#09090f 48%,#050509 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.card{width:min(430px,100%);background:rgba(17,17,26,.97);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.4)}.brand{font-size:27px;font-weight:950;letter-spacing:-.05em}.brand i{font-style:normal;color:#a978ff}.tag{margin:8px 0 24px;color:var(--muted);line-height:1.5;font-size:13px}label{display:block;margin:12px 0 6px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:#bdbdc8}input{width:100%;padding:13px;border-radius:11px;border:1px solid #3b3b47;background:#09090e;color:#fff;font:inherit;outline:none}button{width:100%;margin-top:14px;padding:13px 15px;border:0;border-radius:11px;background:linear-gradient(135deg,#9b5cf6,#7140d4);color:#fff;font-weight:900;cursor:pointer}button.secondary{background:#272732}button:disabled{opacity:.55;cursor:wait}.notice{margin-top:15px;padding:11px 12px;border-radius:11px;border:1px solid #30303b;background:#0b0b11;color:var(--muted);font-size:11px;line-height:1.5}.status{min-height:20px;margin-top:14px;font-size:12px;color:var(--muted);white-space:pre-wrap}.status.error{color:var(--danger)}.status.ok{color:var(--ok)}.user{display:none;margin-top:18px;padding:13px;border-radius:12px;background:#0b0b11;border:1px solid #30303b}.user b{display:block;margin-bottom:5px}.links{display:flex;gap:10px;margin-top:10px}.links a{color:#cdb4ff;font-weight:800;text-decoration:none;font-size:12px}.divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:#777783;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.divider:before,.divider:after{content:"";height:1px;background:#30303b;flex:1}
</style>
</head>
<body><main class="card">
<div class="brand">Reels<i>AI</i> Studio</div><div class="tag">Crie sua conta grátis ou entre para usar o ReelsAI Studio.</div>
<section id="loginBox"><label>E-mail</label><input id="email" type="email" autocomplete="username" placeholder="cliente@empresa.com"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"><button id="login">Entrar no aplicativo</button><button id="recover" class="secondary">Esqueci minha senha</button><div class="divider">Novo cliente?</div><button id="showSignup" class="secondary">Criar minha conta grátis</button></section>
<section id="signupBox" style="display:none"><label>Nome</label><input id="signupName" type="text" autocomplete="name" placeholder="Seu nome"><label>E-mail</label><input id="signupEmail" type="email" autocomplete="email" placeholder="voce@empresa.com"><label>Senha</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="Mínimo 10 caracteres"><label>Confirmar senha</label><input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repita sua senha"><button id="signup">Criar conta grátis</button><button id="showLogin" class="secondary">Já tenho uma conta</button></section>
<section id="setPasswordBox" style="display:none"><label>Nova senha</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Mínimo 10 caracteres"><label>Confirmar nova senha</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repita a senha"><button id="savePassword">Salvar nova senha</button></section>
<section id="userBox" class="user"><b id="userEmail"></b><span>Você está autenticado.</span><button id="openApp">Abrir ReelsAI Studio</button><button id="logout" class="secondary">Sair</button></section>
<div id="status" class="status"></div><div class="notice">Conta grátis disponível. A autenticação é feita pelo Netlify Identity e a senha não fica armazenada no código.</div><div class="links"><a href="/">Voltar ao site</a><a href="/planos">Ver planos</a></div>
</main>
<script type="module">
import {login,logout,getUser,handleAuthCallback,acceptInvite,updateUser,signup} from 'https://cdn.jsdelivr.net/npm/@netlify/identity@2.0.0/+esm';
const $=id=>document.getElementById(id);let inviteToken='';let recovery=false;
function status(msg,type=''){const e=$('status');e.textContent=msg;e.className='status '+type}
function showLogin(){ $('loginBox').style.display='block';$('signupBox').style.display='none';$('setPasswordBox').style.display='none' }
function showSignup(){ $('loginBox').style.display='none';$('signupBox').style.display='block';$('setPasswordBox').style.display='none';$('signupName').focus() }
function showPassword(mode){recovery=mode==='recovery';$('loginBox').style.display='none';$('signupBox').style.display='none';$('userBox').style.display='none';$('setPasswordBox').style.display='block';$('newPassword').focus()}
async function boot(){try{const cb=await handleAuthCallback();if(cb?.type==='recovery'){showPassword('recovery');status('Link de recuperação validado. Crie sua nova senha.','ok');return}if(cb?.type==='invite'&&cb.token){inviteToken=cb.token;showPassword('invite');status('Convite validado. Crie sua senha para ativar a conta.','ok');return}const u=await getUser();if(u){$('loginBox').style.display='none';$('signupBox').style.display='none';$('userBox').style.display='block';$('userEmail').textContent=u.email||'Cliente autenticado';status('Sessão ativa.','ok');return}if(new URLSearchParams(location.search).get('signup')==='1')showSignup()}catch(e){status(e?.message||'Não foi possível iniciar a autenticação.','error')}}
$('showSignup').onclick=showSignup;$('showLogin').onclick=showLogin;
$('signup').onclick=async()=>{const name=$('signupName').value.trim(),email=$('signupEmail').value.trim().toLowerCase(),password=$('signupPassword').value,confirm=$('signupConfirm').value;if(!email||!password){status('Informe e-mail e senha.','error');return}if(password.length<10){status('A senha precisa ter pelo menos 10 caracteres.','error');return}if(password!==confirm){status('As senhas não coincidem.','error');return}$('signup').disabled=true;status('Criando sua conta...');try{await signup(email,password,name?{full_name:name}:undefined);$('signupPassword').value='';$('signupConfirm').value='';status('Conta criada! Verifique seu e-mail para confirmar o cadastro e depois entre no aplicativo.','ok');setTimeout(showLogin,700)}catch(e){status(e?.message||'Não foi possível criar a conta.','error')}finally{$('signup').disabled=false}};
$('login').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password){status('Informe e-mail e senha.','error');return}$('login').disabled=true;status('Entrando...');try{const u=await login(email,password);if(!u)throw new Error('A autenticação não foi concluída.');status('Login realizado com sucesso.','ok');window.location.href='/'}catch(e){status(e?.message||'E-mail ou senha inválidos.','error')}finally{$('login').disabled=false}};
$('recover').onclick=()=>{location.href='/forgot-password'};
$('savePassword').onclick=async()=>{const p=$('newPassword').value,c=$('confirmPassword').value;if(p.length<10){status('A senha precisa ter pelo menos 10 caracteres.','error');return}if(p!==c){status('As senhas não coincidem.','error');return}$('savePassword').disabled=true;status('Salvando senha...');try{if(inviteToken)await acceptInvite(inviteToken,p);else if(recovery)await updateUser({password:p});else throw new Error('Fluxo de senha inválido.');status('Senha criada. Abrindo o aplicativo...','ok');setTimeout(()=>location.href='/',400)}catch(e){status(e?.message||'Não foi possível salvar a senha.','error')}finally{$('savePassword').disabled=false}};
$('openApp').onclick=()=>location.href='/';$('logout').onclick=async()=>{await logout();location.href='/login'};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});$('signupConfirm').addEventListener('keydown',e=>{if(e.key==='Enter')$('signup').click()});boot();
</script></body></html>
