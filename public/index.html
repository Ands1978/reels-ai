<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelsAI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#fff;font-family:Arial,sans-serif}.container{max-width:900px;margin:auto;padding:35px 20px}.logo{font-size:30px;font-weight:bold;margin-bottom:25px}.logo span{color:#9b5cff}.card{background:#15151d;border:1px solid #30303b;border-radius:18px;padding:25px}h1{margin-top:0}.sub{color:#aaa;margin-bottom:25px}label{display:block;color:#bbb;margin:15px 0 8px}textarea,select{width:100%;background:#0d0d12;color:#fff;border:1px solid #373744;border-radius:10px;padding:13px;font:inherit}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}button{border:0;border-radius:10px;padding:15px;background:#8b5cf6;color:#fff;font-weight:bold;cursor:pointer}button:hover{background:#7046d5}button:disabled{opacity:.5;cursor:wait}.secondary{background:#272735}.status{margin-top:18px;color:#aaa}.reel{margin-top:18px;padding:18px;background:#1d1d27;border-radius:12px}.reel-title{display:block;font-size:18px;margin-bottom:6px}.reel-meta{color:#999;font-size:13px;margin-bottom:10px}.scene{padding:10px 0;border-bottom:1px solid #30303d;color:#ddd}.video-area{margin-top:20px;text-align:center}.video-area video{width:320px;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:15px}.download{display:inline-block;margin-top:12px;padding:13px 20px;background:#22c55e;color:#06120a;border-radius:10px;text-decoration:none;font-weight:bold}.info{color:#888;font-size:13px;margin-top:10px}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.thumbs img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:#08080d}@media(max-width:650px){.row,.buttons{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="container"><div class="logo">Reels<span>AI</span></div><div class="card">
<h1>Crie seus Reels automaticamente</h1>
<div class="sub">Roteiro profissional, imagens por cena, narração, movimento, legendas e trilha ambiente em 9:16.</div>
<label for="idea">Tema do Reel</label><textarea id="idea" placeholder="Ex.: 5 ferramentas de IA para ganhar dinheiro"></textarea>
<div class="row"><div><label for="duration">Duração</label><select id="duration"><option value="30">30 segundos</option><option value="45">45 segundos</option><option value="60">60 segundos</option></select></div><div><label for="style">Estilo</label><select id="style"><option>Viral / rápido</option><option>Educativo</option><option>Motivacional</option><option>Storytelling</option></select></div></div>
<div class="buttons"><button id="btn1" onclick="generate(1)">🎬 GERAR 1 REEL</button><button id="btn10" onclick="generate(10)">⚡ GERAR 10 REELS</button></div>
<div id="status" class="status">Digite um tema para começar.</div><div id="result"></div>
</div></div>
<script>
function setStatus(text){document.getElementById("status").textContent=text}
async function generate(count){const idea=document.getElementById("idea").value.trim(),duration=Number(document.getElementById("duration").value),style=document.getElementById("style").value,result=document.getElementById("result");if(!idea){alert("Digite um tema primeiro.");return}document.getElementById("btn1").disabled=true;document.getElementById("btn10").disabled=true;setStatus("🤖 Criando roteiros profissionais...");result.innerHTML="";try{const r=await fetch("/.netlify/functions/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idea,duration,style,count})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Erro ao gerar roteiro.");const reels=data.items.map((item,i)=>createReel({...item,index:i+1,topic:idea}));if(count===10){for(let i=0;i<reels.length;i++){setStatus(`🎞️ Produzindo Reel ${i+1} de ${reels.length}...`);await createVideo(reels[i].item,reels[i].videoButton,reels[i].reel)}}setStatus(count===10?"✅ 10 Reels produzidos com imagens, voz e trilha!":"✅ Reel pronto para renderização.")}catch(e){setStatus("❌ "+e.message)}finally{document.getElementById("btn1").disabled=false;document.getElementById("btn10").disabled=false}}
function createReel(item){const result=document.getElementById("result"),reel=document.createElement("div");reel.className="reel";const title=document.createElement("strong");title.className="reel-title";title.textContent=`🎬 Reel ${item.index}: ${item.titulo||"Sem título"}`;reel.appendChild(title);const meta=document.createElement("div");meta.className="reel-meta";meta.textContent=`Estilo: ${item.style||"viral"} · ${item.duration}s · imagens IA · narração`;reel.appendChild(meta);item.scenes.forEach(scene=>{const div=document.createElement("div");div.className="scene";div.textContent=`${scene.start}s – ${scene.end}s: ${scene.text}`;reel.appendChild(div)});const videoButton=document.createElement("button");videoButton.className="secondary";videoButton.style.marginTop="15px";videoButton.textContent="🎬 GERAR VÍDEO PROFISSIONAL";videoButton.onclick=async()=>{try{await createVideo(item,videoButton,reel)}catch(e){videoButton.disabled=false;videoButton.textContent="🎬 GERAR VÍDEO PROFISSIONAL";setStatus("❌ "+e.message)}};reel.appendChild(videoButton);result.appendChild(reel);return{item,videoButton,reel}}
async function requestImage(topic,scene,style){const r=await fetch("/.netlify/functions/generate-image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,scene,style})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Erro ao gerar imagem.");return d.image}
async function getImages(item,reel){if(item.images&&item.images.length===item.scenes.length)return item.images;item.images=[];const thumbs=document.createElement("div");thumbs.className="thumbs";reel.appendChild(thumbs);for(let i=0;i<item.scenes.length;i++){setStatus(`🖼️ Criando imagem ${i+1} de ${item.scenes.length} do Reel ${item.index}...`);const src=await requestImage(item.topic,item.scenes[i].text,item.style);item.images.push(src);const img=document.createElement("img");img.src=src;thumbs.appendChild(img)}return item.images}
async function getNarrationBlob(item){if(item.narrationBlob)return item.narrationBlob;setStatus(`🎙️ Gerando narração do Reel ${item.index}...`);const text=item.scenes.map(s=>s.text).join(" ").trim();const r=await fetch("/.netlify/functions/narrate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});if(!r.ok){let m="Erro ao gerar a narração.";try{m=(await r.json()).error||m}catch(_){}throw new Error(m)}item.narrationBlob=await r.blob();return item.narrationBlob}
function loadImages(sources){return Promise.all(sources.map(src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("Não foi possível carregar uma imagem."));img.src=src})))}
async function createVideo(item,button,reel){if(!Array.isArray(item.scenes)||!item.scenes.length)throw new Error("O roteiro não possui cenas.");button.disabled=true;button.textContent="⏳ Preparando imagens...";const sources=await getImages(item,reel),images=await loadImages(sources),blob=await getNarrationBlob(item),audioUrl=URL.createObjectURL(blob),audio=new Audio(audioUrl);audio.preload="auto";await new Promise((res,rej)=>{audio.onloadedmetadata=res;audio.onerror=()=>rej(new Error("Não foi possível carregar a narração."))});if(typeof audio.captureStream!=="function")throw new Error("Use Chrome ou Edge para gerar vídeo com áudio.");button.textContent="⏳ Renderizando com voz e trilha...";return new Promise(async(resolve,reject)=>{const canvas=document.createElement("canvas");canvas.width=540;canvas.height=960;const ctx=canvas.getContext("2d"),videoStream=canvas.captureStream(30),audioContext=new AudioContext(),destination=audioContext.createMediaStreamDestination(),source=audioContext.createMediaElementSource(audio),voiceGain=audioContext.createGain(),musicGain=audioContext.createGain();voiceGain.gain.value=1;musicGain.gain.value=.035;source.connect(voiceGain);voiceGain.connect(destination);const oscillators=[];[130.81,164.81,196,246.94].forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.12/(i+2);o.connect(g);g.connect(musicGain);o.start();oscillators.push(o)});musicGain.connect(destination);destination.stream.getAudioTracks().forEach(t=>videoStream.addTrack(t));let mime="video/webm;codecs=vp9,opus";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm;codecs=vp8,opus";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm";let recorder;try{recorder=new MediaRecorder(videoStream,{mimeType:mime,videoBitsPerSecond:3500000})}catch(e){cleanup();reject(new Error("Este navegador não conseguiu iniciar a gravação."));return}const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=()=>{cleanup();reject(new Error("Falha durante a renderização."))};recorder.onstop=()=>{const out=new Blob(chunks,{type:"video/webm"}),url=URL.createObjectURL(out),area=document.createElement("div");area.className="video-area";const video=document.createElement("video");video.controls=true;video.playsInline=true;video.src=url;const dl=document.createElement("a");dl.href=url;dl.download=`reelsai-reel-${String(item.index).padStart(2,"0")}.webm`;dl.className="download";dl.textContent="⬇️ BAIXAR REEL";const info=document.createElement("div");info.className="info";info.textContent="9:16 · 5 imagens IA · narração · movimento · legendas · trilha ambiente";area.append(video,dl,info);reel.appendChild(area);button.remove();cleanup();resolve({blob:out,url})};await audioContext.resume();recorder.start();audio.currentTime=0;audio.play().catch(()=>{try{recorder.stop()}catch(_){}reject(new Error("O navegador bloqueou a reprodução da narração."))});const total=Math.max(Number(item.scenes[item.scenes.length-1].end)*1000,(audio.duration||0)*1000),start=performance.now();let stopped=false;function cleanup(){try{audio.pause();oscillators.forEach(o=>o.stop())}catch(_){}try{audioContext.close()}catch(_){}URL.revokeObjectURL(audioUrl)}function stop(){if(stopped)return;stopped=true;audio.pause();drawScene(item.scenes[item.scenes.length-1],1,item.scenes.length-1,1);recorder.stop()}function animate(now){const elapsed=now-start;if(elapsed>=total){stop();return}const sec=elapsed/1000;let idx=item.scenes.length-1,p=1;for(let i=0;i<item.scenes.length;i++){const s=item.scenes[i];if(sec>=Number(s.start)&&sec<Number(s.end)){idx=i;p=(sec-Number(s.start))/(Number(s.end)-Number(s.start));break}}drawScene(item.scenes[idx],p,idx,elapsed/total);requestAnimationFrame(animate)}function drawScene(scene,p,idx,totalProgress){const img=images[idx],scale=Math.max(540/img.width,960/img.height)*(1+.07*p),w=img.width*scale,h=img.height*scale,x=(540-w)/2+(idx%2?-14*p:14*p),y=(960-h)/2-8*p;ctx.clearRect(0,0,540,960);ctx.drawImage(img,x,y,w,h);const shade=ctx.createLinearGradient(0,0,0,960);shade.addColorStop(0,"rgba(0,0,0,.20)");shade.addColorStop(.45,"rgba(0,0,0,.18)");shade.addColorStop(1,"rgba(0,0,0,.80)");ctx.fillStyle=shade;ctx.fillRect(0,0,540,960);ctx.fillStyle="#9b5cff";ctx.fillRect(38,48,90,7);ctx.fillStyle="#fff";ctx.font="bold 25px Arial";ctx.fillText("ReelsAI",38,95);ctx.textAlign="center";const words=String(scene.text).split(/\s+/),visible=Math.max(1,Math.ceil(words.length*Math.min(1,p+.25)));ctx.font="bold 38px Arial";drawWrapped(words.slice(0,visible).join(" "),270,470,450,48);ctx.font="16px Arial";ctx.fillStyle="rgba(255,255,255,.72)";ctx.fillText("Narração automática",270,850);ctx.fillStyle="rgba(255,255,255,.28)";ctx.fillRect(45,900,450,5);ctx.fillStyle="#9b5cff";ctx.fillRect(45,900,450*Math.min(1,totalProgress),5);ctx.textAlign="left"}function drawWrapped(text,x,y,maxWidth,lineHeight){const words=text.split(" "),lines=[];let line="";for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);const top=y-(lines.length*lineHeight)/2;lines.forEach((t,i)=>ctx.fillText(t,x,top+i*lineHeight))}requestAnimationFrame(animate)})}
</script>
</body>
</html>
