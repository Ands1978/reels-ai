<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha — ReelsAI Studio</title>
<style>
:root{--bg:#07070b;--panel:#11111a;--line:#30303b;--text:#f8f8fb;--muted:#a4a4b2;--accent:#8b5cf6;--danger:#ff7180;--ok:#6fe39a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,#29164a 0,#09090f 48%,#050509 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.card{width:min(430px,100%);background:rgba(17,17,26,.97);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.4)}.brand{font-size:27px;font-weight:950;letter-spacing:-.05em}.brand i{font-style:normal;color:#a978ff}.tag{margin:8px 0 24px;color:var(--muted);line-height:1.5;font-size:13px}label{display:block;margin:12px 0 6px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:#bdbdc8}input{width:100%;padding:13px;border-radius:11px;border:1px solid #3b3b47;background:#09090e;color:#fff;font:inherit;outline:none}button{width:100%;margin-top:14px;padding:13px 15px;border:0;border-radius:11px;background:linear-gradient(135deg,#9b5cf6,#7140d4);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{min-height:42px;margin-top:14px;font-size:12px;line-height:1.5;color:var(--muted)}.status.error{color:var(--danger)}.status.ok{color:var(--ok)}a{display:block;text-align:center;margin-top:16px;color:#cdb4ff;font-weight:800;text-decoration:none;font-size:12px}.notice{margin-top:15px;padding:11px 12px;border-radius:11px;border:1px solid #30303b;background:#0b0b11;color:var(--muted);font-size:11px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<div class="brand">Reels<i>AI</i> Studio</div>
<div class="tag">Recupere o acesso à sua conta de cliente.</div>
<label for="email">E-mail cadastrado</label>
<input id="email" type="email" autocomplete="email" placeholder="cliente@empresa.com">
<button id="send">Enviar link para redefinir senha</button>
<div id="status" class="status"></div>
<div class="notice">Você receberá um e-mail do Netlify com um link seguro para criar uma nova senha. Verifique também a pasta de spam.</div>
<a href="/login">← Voltar para o login</a>
<script type="module">
import { recoverPassword } from 'https://cdn.jsdelivr.net/npm/@netlify/identity@2.0.0/+esm';
const email=document.getElementById('email'),send=document.getElementById('send'),status=document.getElementById('status');
const setStatus=(m,t='')=>{status.textContent=m;status.className='status '+t};
send.onclick=async()=>{const value=email.value.trim();if(!value){setStatus('Digite o e-mail cadastrado.','error');email.focus();return}send.disabled=true;setStatus('Enviando link de recuperação...');try{await recoverPassword(value);setStatus('Se este e-mail estiver cadastrado, o link de recuperação foi enviado. Abra o e-mail e siga o link para criar uma nova senha.','ok')}catch(e){setStatus(e?.message||'Não foi possível enviar o link de recuperação. Verifique se o Identity está ativado no Netlify.','error')}finally{send.disabled=false}};
email.addEventListener('keydown',e=>{if(e.key==='Enter')send.click()});
</script>
</main>
</body>
</html>
