[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  function = "capcut-tools"

# Public customer login page.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

# Keep the existing frontend URL, but send generation through the resilient function.
[[redirects]]
  from = "/.netlify/functions/generate"
  to = "/.netlify/functions/generate-safe"
  status = 200
  force = true

# Simple API health endpoint.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
