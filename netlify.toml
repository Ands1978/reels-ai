[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  function = "capcut-tools"

# Customer login page.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

# The editor is available only to authenticated customer/admin roles.
[[redirects]]
  from = "/"
  to = "/"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/"
  to = "/login"
  status = 302
  force = true

# Only authenticated customers/admins can call the AI generator.
[[redirects]]
  from = "/.netlify/functions/generate"
  to = "/.netlify/functions/generate"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
