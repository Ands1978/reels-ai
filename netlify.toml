[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  function = "capcut-tools"

# Customer login page.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

# Administrator panel: only users with the admin role can reach it.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/admin"
  to = "/login"
  status = 302
  force = true

# The editor is available only to authenticated customer/admin roles.
[[redirects]]
  from = "/"
  to = "/"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/"
  to = "/login"
  status = 302
  force = true

# Only admins can call the customer-management function.
[[redirects]]
  from = "/.netlify/functions/admin-users"
  to = "/.netlify/functions/admin-users"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/.netlify/functions/admin-users"
  to = "/login"
  status = 302
  force = true

# Only authenticated customers/admins can call the AI generator.
[[redirects]]
  from = "/.netlify/functions/generate"
  to = "/.netlify/functions/generate"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
