[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  function = "capcut-tools"

# Customer login page.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

# Administrator panel: Netlify Identity admin role only.
# Role-gated rules intentionally omit `to`, per Netlify's RBAC syntax.
[[redirects]]
  from = "/admin"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/admin"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/admin.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/admin.html"
  to = "/login"
  status = 302
  force = true

# The editor is available only to authenticated customer/admin roles.
[[redirects]]
  from = "/"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/"
  to = "/login"
  status = 302
  force = true

# Also protect direct access to the static editor file.
[[redirects]]
  from = "/index.html"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/index.html"
  to = "/login"
  status = 302
  force = true

# Customer-management function has its own server-side admin check.
[[redirects]]
  from = "/.netlify/functions/admin-users"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

# AI generation function has its own server-side authentication check.
[[redirects]]
  from = "/.netlify/functions/generate"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/api/generate"
  status = 200
  force = true
  conditions = {Role = ["customer", "admin"]}

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
