[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Protect the application root without touching the generation function.
[[edge_functions]]
  path = "/"
  function = "auth-gate"

# Show the customer's current subscription and management action in the app.
[[edge_functions]]
  path = "/"
  function = "subscription-panel"

# Keep the existing editor/tooling middleware unchanged for the rest of the site.
[[edge_functions]]
  path = "/*"
  function = "capcut-tools"

# Local MP3 middleware integrates music with the existing Reel state/export.
[[edge_functions]]
  path = "/*"
  function = "mp3-music"

# Public customer login page.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

# Public pricing / sales page.
[[redirects]]
  from = "/planos"
  to = "/planos.html"
  status = 200
  force = true

# Free Pixabay image bank.
[[redirects]]
  from = "/banco-imagens"
  to = "/banco-imagens.html"
  status = 200
  force = true

# Secure server-side handoff to the Stripe Payment Link for each plan.
[[redirects]]
  from = "/checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200
  force = true

# Stripe subscription webhook for automatic plan entitlement.
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

# Customer-only Stripe Billing Portal.
[[redirects]]
  from = "/api/customer-portal"
  to = "/.netlify/functions/customer-portal"
  status = 200
  force = true

# Route generation to the resilient endpoint that does not depend on the broken server-side session lookup.
[[redirects]]
  from = "/.netlify/functions/generate"
  to = "/.netlify/functions/generate-public"
  status = 200
  force = true

# Simple API health endpoint.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
